<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Una pequeña aventura para Fernanda 🐾</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Quicksand:wght@400;500;600;700&display=swap');

*{box-sizing:border-box}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    overflow-x:hidden;
    background:#09070a;
    color:#59434b;
    font-family:'Quicksand',sans-serif;
}

button{
    font-family:inherit;
}

.hidden{
    display:none!important;
}

/* =====================================================
   PORTADA
===================================================== */

#loading{
    position:fixed;
    inset:0;
    z-index:99999;
    background:
        radial-gradient(circle at 50% 45%,#211a20 0%,#09080b 55%,#030304 100%);
    color:white;
    overflow:hidden;
}

.load-title{
    position:absolute;
    top:12%;
    width:100%;
    text-align:center;
    font-family:'Cormorant Garamond',serif;
    font-size:clamp(25px,7vw,48px);
    color:#ffe9b0;
    letter-spacing:3px;
    text-shadow:0 0 20px #dcb55b;
}

.load-subtitle{
    position:absolute;
    top:21%;
    width:100%;
    text-align:center;
    color:#d9d0d3;
    font-size:13px;
    letter-spacing:2px;
}

/* Gatito pixelado */
.pixel-cat{
    position:absolute;
    left:7%;
    bottom:38%;
    width:82px;
    height:82px;
    animation:walkCat 5s linear forwards;
    filter:drop-shadow(0 0 13px rgba(255,255,255,.85));
}

.pixel-cat .body{
    position:absolute;
    width:48px;
    height:39px;
    left:17px;
    top:31px;
    background:#fff;
    border-radius:7px;
}

.pixel-cat .head{
    position:absolute;
    width:51px;
    height:43px;
    left:13px;
    top:10px;
    background:#fff;
    border-radius:7px;
}

.pixel-cat .ear{
    position:absolute;
    width:19px;
    height:22px;
    background:#fff;
    top:0;
    z-index:2;
}

.pixel-cat .ear.left{
    left:13px;
    clip-path:polygon(0 100%,18% 0,100% 100%);
}

.pixel-cat .ear.right{
    right:13px;
    clip-path:polygon(0 100%,82% 0,100% 100%);
}

.pixel-cat .eye{
    position:absolute;
    width:6px;
    height:6px;
    background:#29242a;
    top:27px;
    z-index:3;
}

.pixel-cat .eye.left{left:26px}
.pixel-cat .eye.right{right:26px}

.pixel-cat .nose{
    position:absolute;
    width:6px;
    height:4px;
    background:#e7a4b7;
    top:37px;
    left:37px;
    z-index:3;
}

.pixel-cat .leg{
    position:absolute;
    width:9px;
    height:22px;
    background:#fff;
    top:62px;
    z-index:-1;
}

.pixel-cat .leg.one{left:25px}
.pixel-cat .leg.two{left:53px}

.pixel-cat .tail{
    position:absolute;
    width:35px;
    height:9px;
    right:-15px;
    top:48px;
    background:#fff;
    transform:rotate(-35deg);
    border-radius:10px;
}

/* Brillitos */
.sparkle{
    position:absolute;
    color:#ffe9a7;
    text-shadow:0 0 12px #fff0b0,0 0 25px #d8ae52;
    animation:twinkle 1.4s ease-in-out infinite alternate;
}

.s1{left:15%;top:32%;font-size:13px}
.s2{left:31%;top:57%;font-size:20px;animation-delay:.3s}
.s3{left:48%;top:29%;font-size:14px;animation-delay:.7s}
.s4{left:67%;top:51%;font-size:18px;animation-delay:.2s}
.s5{left:83%;top:34%;font-size:13px;animation-delay:.9s}
.s6{left:90%;top:68%;font-size:19px;animation-delay:.5s}
.s7{left:10%;top:69%;font-size:16px;animation-delay:1s}

/* Patitas */
.paw{
    position:absolute;
    color:#ead7a4;
    opacity:.45;
    text-shadow:0 0 12px #fff0bd;
    animation:pawFloat 3s ease-in-out infinite;
}

.p1{left:8%;top:18%;font-size:24px;transform:rotate(-20deg)}
.p2{right:12%;top:18%;font-size:20px;transform:rotate(20deg);animation-delay:.6s}
.p3{left:20%;bottom:20%;font-size:17px;transform:rotate(15deg);animation-delay:1s}
.p4{right:22%;bottom:19%;font-size:24px;transform:rotate(-12deg);animation-delay:1.4s}
.p5{right:5%;bottom:38%;font-size:16px;animation-delay:.8s}

/* Barra */
.loading-track{
    position:absolute;
    width:min(78%,650px);
    height:13px;
    left:11%;
    bottom:27%;
    border:1px solid #b99148;
    border-radius:50px;
    background:#161217;
    box-shadow:0 0 18px rgba(255,217,137,.15);
    overflow:visible;
}

.loading-bar{
    width:0;
    height:100%;
    border-radius:50px;
    background:linear-gradient(
        90deg,
        #9c6d27,
        #ffe8a1,
        #d3a449
    );
    box-shadow:0 0 20px #e7c46c;
    animation:loadingBar 5s linear forwards;
}

.end-paw{
    position:absolute;
    right:-16px;
    top:-24px;
    font-size:28px;
    opacity:0;
    animation:pawEnd 5s linear forwards;
}

/* Bienvenida */
#welcome{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    opacity:0;
    pointer-events:none;
}

#welcome.show{
    animation:welcomeIn .9s ease forwards;
    pointer-events:auto;
}

#welcome h1{
    margin:0;
    font-family:'Cormorant Garamond',serif;
    font-size:clamp(48px,12vw,92px);
    color:#f6dfa0;
    text-shadow:0 0 30px #b88b3c;
}

#welcome p{
    color:#e8e2e5;
    font-size:16px;
    margin:10px 20px 25px;
}

.gold-btn,
.pink-btn{
    border:0;
    border-radius:999px;
    padding:14px 30px;
    font-size:16px;
    font-weight:700;
    color:white;
    cursor:pointer;
    transition:.3s;
}

.gold-btn{
    background:linear-gradient(135deg,#e0bc65,#9d6e2d);
    box-shadow:0 8px 25px rgba(120,82,26,.35);
}

.pink-btn{
    background:linear-gradient(135deg,#eaa5bb,#b85f7e);
    box-shadow:0 8px 25px rgba(140,70,91,.22);
}

.gold-btn:hover,
.pink-btn:hover{
    transform:translateY(-4px) scale(1.04);
}

/* =====================================================
   JUEGO
===================================================== */

#game{
    min-height:100vh;
    background:
        linear-gradient(
            #f7dfb1 0%,
            #d9e9c1 45%,
            #9cc48b 100%
        );
    position:relative;
}

#game:before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:.4;
    background-image:
        radial-gradient(circle,#fff 0 1px,transparent 2px);
    background-size:120px 120px;
    animation:starsMove 10s linear infinite;
}

.topbar{
    position:fixed;
    top:12px;
    left:12px;
    right:12px;
    z-index:500;
    display:flex;
    justify-content:space-between;
    pointer-events:none;
}

.topbar button{
    pointer-events:auto;
    border:0;
    padding:10px 14px;
    border-radius:17px;
    background:#fffdf3e8;
    cursor:pointer;
    box-shadow:0 5px 20px #5d4d4020;
}

.scene{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:80px 17px 35px;
}

.card{
    width:min(930px,100%);
    padding:32px 23px;
    border-radius:35px;
    text-align:center;
    background:#fffdf4ef;
    box-shadow:0 25px 70px rgba(67,70,48,.23);
    animation:sceneIn .7s ease;
}

.title{
    margin:5px 0 15px;
    color:#8c4d5e;
    font-family:'Cormorant Garamond',serif;
    font-size:clamp(38px,8vw,60px);
}

.text{
    font-size:17px;
    line-height:1.8;
}

.dialogue{
    max-width:720px;
    margin:20px auto;
    padding:22px;
    background:#fff;
    border:1px solid #eadbd2;
    border-radius:25px;
    line-height:1.75;
    font-size:17px;
    box-shadow:0 8px 25px #00000009;
}

.cat-avatar{
    font-size:105px;
    display:inline-block;
    animation:breathe 2.3s ease-in-out infinite;
}

.choice-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:13px;
    max-width:820px;
    margin:22px auto;
}

.choice{
    border:1px solid #ead3ca;
    background:#fff;
    border-radius:22px;
    padding:20px 10px;
    min-height:105px;
    cursor:pointer;
    font-size:16px;
    transition:.3s;
}

.choice:hover{
    transform:translateY(-6px);
    box-shadow:0 15px 30px #76505a20;
}

.path{
    min-height:230px;
    border-radius:30px;
    padding:25px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}

.flowers{
    background:linear-gradient(135deg,#fff1f4,#e0f2ce);
}

.forest{
    background:linear-gradient(135deg,#dcebd1,#8ebc99);
}

.night{
    background:linear-gradient(135deg,#332b55,#11182d);
    color:white;
}

.progress{
    height:9px;
    max-width:600px;
    margin:15px auto;
    background:#eadfd7;
    border-radius:20px;
    overflow:hidden;
}

.progress span{
    display:block;
    width:0;
    height:100%;
    background:#c78b52;
    transition:.4s;
}

/* =====================================================
   MAPA
===================================================== */

#map{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:8px;
    max-width:750px;
    margin:25px auto;
}

.node{
    padding:14px 4px;
    border-radius:15px;
    background:#e5dfd7;
    color:#777;
    font-size:12px;
}

.node.done{
    background:#b9d69e;
    color:#35532d;
}

.node.open{
    background:#f3d59a;
    color:#704f24;
}

.node.lock{
    opacity:.4;
}

/* =====================================================
   BOLSITO
===================================================== */

.inventory{
    max-width:500px;
    margin:20px auto;
    padding:20px;
    border-radius:25px;
    background:#fff7ef;
    box-shadow:0 10px 30px #0002;
}

.item{
    background:white;
    padding:13px;
    margin:7px 0;
    border-radius:13px;
}

/* =====================================================
   PERSONALIZACIÓN
===================================================== */

.customizer{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
    align-items:center;
}

.cat-preview{
    min-height:260px;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    font-size:130px;
}

.accessory{
    position:absolute;
    pointer-events:none;
}

.bow{
    top:12px;
    right:calc(50% - 70px);
    font-size:45px;
}

.shoes{
    bottom:20px;
    font-size:28px;
    letter-spacing:22px;
}

.eye-accessory{
    position:absolute;
    top:98px;
    left:calc(50% - 25px);
    font-size:23px;
}

.options{
    background:#fff7f1;
    border-radius:25px;
    padding:20px;
    text-align:left;
}

.options h3{
    color:#8c4d5e;
    font-family:'Cormorant Garamond',serif;
    font-size:28px;
    margin:10px 0;
}

.opts{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}

.opt{
    border:1px solid #ead3ca;
    background:white;
    border-radius:14px;
    padding:10px;
    cursor:pointer;
}

.opt.selected{
    outline:3px solid #e0a0ae;
}

/* =====================================================
   ESTRELLAS
===================================================== */

.stars-game{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:25px;
    max-width:650px;
    margin:25px auto;
}

.star{
    font-size:38px;
    cursor:pointer;
    animation:twinkle 1s infinite alternate;
}

.star.found{
    opacity:.15;
    transform:scale(.7);
    pointer-events:none;
}

/* =====================================================
   OBJETOS
===================================================== */

.objects{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:10px;
    max-width:600px;
    margin:20px auto;
}

.object-btn{
    font-size:32px;
    border:0;
    background:white;
    border-radius:18px;
    padding:15px;
    cursor:pointer;
    transition:.2s;
}

.object-btn:hover{
    transform:scale(1.1);
}

/* =====================================================
   REGALO
===================================================== */

.gift{
    display:inline-block;
    font-size:120px;
    cursor:pointer;
    animation:giftMove 1.8s ease-in-out infinite;
    filter:drop-shadow(0 15px 15px #8a506033);
}

/* =====================================================
   CARTA
===================================================== */

.letter-wrap{
    max-width:760px;
    margin:auto;
    position:relative;
}

.hello{
    position:absolute;
    right:0;
    top:-30px;
    font-size:60px;
    z-index:2;
}

.letter{
    background:#fffaf0;
    padding:35px 28px;
    border-radius:8px;
    box-shadow:0 15px 40px #49352a25;
    text-align:left;
    line-height:1.9;
    font-family:'Cormorant Garamond',serif;
    font-size:21px;
    border:1px solid #ead8b9;
}

.letter hr{
    border:0;
    border-top:1px solid #dbc9a7;
    margin:18px 0;
}

.type{
    white-space:pre-wrap;
    min-height:360px;
}

/* =====================================================
   CONFETI
===================================================== */

.confetti{
    position:fixed;
    pointer-events:none;
    font-size:25px;
    animation:confettiFall 2.5s linear forwards;
    z-index:9999;
}

/* =====================================================
   TRANSICIÓN
===================================================== */

#transition{
    position:fixed;
    inset:0;
    z-index:9000;
    background:#25181d;
    opacity:0;
    pointer-events:none;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#ffe8a5;
    font-size:55px;
}

#transition.go{
    animation:transitionAnimation .8s ease;
}

/* =====================================================
   ANIMACIONES
===================================================== */

@keyframes loadingBar{
    from{width:0}
    to{width:100%}
}

@keyframes walkCat{
    from{left:7%}
    to{left:84%}
}

@keyframes pawEnd{
    0%,88%{opacity:0}
    96%,100%{opacity:1}
}

@keyframes welcomeIn{
    from{
        opacity:0;
        transform:scale(.85);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}

@keyframes twinkle{
    from{
        opacity:.35;
        transform:scale(.8);
    }
    to{
        opacity:1;
        transform:scale(1.2);
    }
}

@keyframes pawFloat{
    0%,100%{
        transform:translateY(0) rotate(0deg);
    }
    50%{
        transform:translateY(-8px) rotate(5deg);
    }
}

@keyframes starsMove{
    to{
        background-position:0 120px;
    }
}

@keyframes sceneIn{
    from{
        opacity:0;
        transform:translateY(28px) scale(.97);
    }
    to{
        opacity:1;
        transform:none;
    }
}

@keyframes breathe{
    50%{
        transform:translateY(-7px) scale(1.03);
    }
}

@keyframes giftMove{
    50%{
        transform:scale(1.09) rotate(2deg);
    }
}

@keyframes confettiFall{
    from{
        transform:translateY(-10vh) rotate(0);
        opacity:1;
    }
    to{
        transform:translateY(110vh) rotate(500deg);
        opacity:0;
    }
}

@keyframes transitionAnimation{
    0%{opacity:0}
    45%{opacity:1}
    100%{opacity:0}
}

/* =====================================================
   MÓVIL
===================================================== */

@media(max-width:650px){

    .choice-grid,
    .customizer{
        grid-template-columns:1fr;
    }

    .objects{
        grid-template-columns:repeat(3,1fr);
    }

    #map{
        grid-template-columns:repeat(3,1fr);
    }

    .letter{
        font-size:19px;
        padding:25px 20px;
    }

    .hello{
        font-size:45px;
    }

    .cat-avatar{
        font-size:85px;
    }

    .loading-track{
        width:76%;
        left:12%;
    }
}
</style>
</head>

<body>

<!-- =====================================================
     PORTADA
===================================================== -->

<div id="loading">

    <div class="load-title">
        Una pequeña aventura
    </div>

    <div class="load-subtitle">
        PREPARANDO ALGO ESPECIAL PARA TI ✨
    </div>

    <!-- Brillitos -->
    <span class="sparkle s1">✦</span>
    <span class="sparkle s2">✧</span>
    <span class="sparkle s3">✦</span>
    <span class="sparkle s4">✧</span>
    <span class="sparkle s5">✦</span>
    <span class="sparkle s6">✧</span>
    <span class="sparkle s7">✦</span>

    <!-- Patitas -->
    <span class="paw p1">🐾</span>
    <span class="paw p2">🐾</span>
    <span class="paw p3">🐾</span>
    <span class="paw p4">🐾</span>
    <span class="paw p5">🐾</span>

    <!-- Gatita pixelada -->
    <div class="pixel-cat">

        <div class="ear left"></div>
        <div class="ear right"></div>

        <div class="head">
            <span class="eye left"></span>
            <span class="eye right"></span>
            <span class="nose"></span>
        </div>

        <div class="body"></div>

        <div class="leg one"></div>
        <div class="leg two"></div>

        <div class="tail"></div>

    </div>

    <!-- Barra -->
    <div class="loading-track">

        <div class="loading-bar"></div>

        <span class="end-paw">
            🐾
        </span>

    </div>

    <!-- Bienvenida -->
    <div id="welcome">

        <h1>
            Bienvenida<br>
            al juego
        </h1>

        <p>
            Una pequeña aventura hecha especialmente para ti 💗
        </p>

        <button
            class="gold-btn"
            onclick="startGame()"
        >
            Continuar 🐾
        </button>

    </div>

</div>

<!-- =====================================================
     TRANSICIÓN
===================================================== -->

<div id="transition">
    🐾
</div>

<!-- =====================================================
     JUEGO
===================================================== -->

<main id="game" class="hidden"></main>

<script>

/* =====================================================
   ESTADO
===================================================== */

const state = {

    friendship:0,

    stars:0,

    gift:null,

    inventory:[],

    bow:"🎀",

    shoes:"👟",

    eyes:"👀"

};


/* =====================================================
   PORTADA
===================================================== */

setTimeout(()=>{

    document.getElementById("welcome")
        .classList.add("show");

},5200);


/* =====================================================
   COMENZAR
===================================================== */

function startGame(){

    document.getElementById("loading").style.display="none";

    document.getElementById("game")
        .classList.remove("hidden");

    firstScene();

}


/* =====================================================
   TRANSICIÓN
===================================================== */

function transition(callback){

    const t=document.getElementById("transition");

    t.classList.remove("go");

    void t.offsetWidth;

    t.classList.add("go");

    setTimeout(callback,400);

}


/* =====================================================
   RENDER
===================================================== */

function render(content){

    document.getElementById("game").innerHTML=`

        <div class="topbar">

            <button onclick="showInventory()">
                🎒 Bolsito
            </button>

            <button onclick="showMap()">
                🗺️ Mapa
            </button>

        </div>

        <section class="scene">

            <div class="card">

                ${content}

            </div>

        </section>

    `;

}


/* =====================================================
   BOTÓN
===================================================== */

function nextButton(text,func){

    return `
        <br>
        <button
            class="pink-btn"
            onclick="${func}"
        >
            ${text || "Continuar 🐾"}
        </button>
    `;

}


/* =====================================================
   PRIMERA ESCENA
===================================================== */

function firstScene(){

    render(`

        <div class="cat-avatar">
            🐱💛
        </div>

        <h1 class="title">
            ¡Hola, Fernanda! 🌷
        </h1>

        <div class="dialogue">

            <p>
                Hola, Fernanda. 💗
            </p>

            <p>
                Soy la gatita que va a acompañarte
                durante esta pequeña aventura. 🐾
            </p>

            <p>
                Este es un
                <strong>juego interactivo</strong>
                hecho especialmente para ti.
            </p>

            <p>
                Aquí podrás tomar decisiones,
                explorar lugares, encontrar objetos
                y descubrir pequeños secretos.
            </p>

            <p>
                Así que piensa bien tus decisiones...
                porque algunas pueden cambiar
                lo que encuentres. 👀
            </p>

        </div>

        ${nextButton(
            "Comenzar la aventura 🌸",
            "gardenScene()"
        )}

    `);

}


/* =====================================================
   JARDÍN
===================================================== */

function gardenScene(){

    transition(()=>{

        render(`

            <div class="path flowers">

                <div class="cat-avatar">
                    🐱💛
                </div>

                <h1 class="title">
                    🌷 El jardín
                </h1>

                <p>
                    La gatita amarilla está sentadita
                    en medio de un hermoso jardín.
                </p>

                <p>
                    Hay flores, árboles y pequeños
                    caminos por todas partes.
                </p>

            </div>

            <div class="dialogue">

                <p>
                    De pronto escucha un pequeño ruido
                    entre las flores...
                </p>

                <strong>
                    ¿Qué debería hacer?

/* =====================================================
   EFECTO ESCRITURA
===================================================== */

function typeWriter(text,id,speed){

    const el=document.getElementById(id);

    let i=0;

    function write(){

        if(i<text.length){

            el.textContent+=text[i];

            i++;

            setTimeout(
                write,
                text[i-1]==="\n"
                    ?500
                    :speed
            );

        }else{

            setTimeout(finalScene,1000);

        }

    }

    write();

}

                He creado esto para ti
                porque me gustas mucho. ♡
            </p>

        `);

    });

}


/* =====================================================
   BOLSITO
===================================================== */

function addItem(icon,name){

    state.inventory.push({
        icon:icon,
        name:name
    });

}


function showInventory(){

    const items=
        state.inventory.length
        ?
        state.inventory.map(item=>`

            <div class="item">

                ${item.icon}
                <strong>
                    ${item.name}
                </strong>

            </div>

        `).join("")
        :
        `<p>
            Tu bolsito todavía está vacío. 🐾
        </p>`;

    render(`

        <h1 class="title">
            🎒 Mi bolsito
        </h1>

        <div class="inventory">

            ${items}

        </div>

        ${nextButton(
            "Volver a la aventura 🐾",
            "houseScene()"
        )}

    `);

}

function setBow(value){
